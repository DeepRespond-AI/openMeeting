name: PR Checks

on:
  pull_request:
  push:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

# Fork PRs run with read-only access and do not need deployment/signing secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Configuration and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release planning
        run: node --test scripts/ci/prepare-release.test.mjs scripts/ci/init-server-env.test.mjs
      - name: Check desktop version consistency
        run: node scripts/ci/check-versions.mjs
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
      - name: Validate deployment and development Compose files
        run: |
          docker compose --env-file server/.env.example -f server/docker-compose.yml config --quiet
          docker compose --env-file server/.env.example -f server/docker-compose.yml -f server/docker-compose.dev.yml config --quiet

  desktop:
    name: Desktop checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies and SDK patch
        run: pnpm install --frozen-lockfile
      - name: Check types, unit tests, media contracts and updater initialization
        run: pnpm test:ci

  native-desktop:
    name: Windows native compile
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      OPENMEETING_SERVER_URL: https://meeting.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build:im-engine
      - name: Check real Rust plugins, permissions and native dependencies
        run: cargo check --locked --lib
      - name: Verify native analytics isolation and sensitive-field filtering
        run: cargo test --locked --lib 'analytics::'

  windows-scripts:
    name: Windows build scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify PowerShell environment loading and credential redaction
        run: node --test frontend/tests/scripts/build-credential-logs.test.mjs

  admin:
    name: Admin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/admin-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: server/admin-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check and build admin UI
        run: pnpm build

  backend:
    name: Backend (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: user_ms
            tests: user_ms/tests
          - suite: meeting_ms
            tests: meeting_ms/tests
          - suite: stt_ms
            tests: stt_ms/tests
          - suite: gateway_ms
            tests: gateway_ms/tests
          - suite: contracts
            tests: tests
    # Each matrix job owns a fresh database, never a deployment database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openmeeting
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: openmeeting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmeeting -d openmeeting_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPENMEETING_ENV: test
      OPENMEETING_DATABASE_URL: postgresql+asyncpg://openmeeting:ci-only-password@127.0.0.1:5432/openmeeting_ci
      OPENMEETING_TEST_DATABASE_URL: postgresql+asyncpg://openmeeting:ci-only-password@127.0.0.1:5432/openmeeting_ci
      OPENMEETING_ADMIN_PASSWORD: ci-only-admin-password
      OPENMEETING_SECRET_KEY: ci-only-shared-secret-for-isolated-tests
      OPENMEETING_EGRESS_PROXY_URL: ''
      OPENMEETING_IM_ENABLED: 'false'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.3
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install audio test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install locked core and test dependencies
        run: uv sync --locked --group dev
      - name: Check compatibility dependency export
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock --quiet > /dev/null
          git diff --exit-code -- requirements.lock
      - name: Run isolated backend suite
        run: uv run --locked pytest "${{ matrix.tests }}" -q --junitxml=../.artifacts/ci/pytest-${{ matrix.suite }}.xml
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.suite }}
          path: .artifacts/ci/pytest-${{ matrix.suite }}.xml
          retention-days: 7
          if-no-files-found: warn

  mobile:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Initialize disposable app configuration
        run: dart run tool/init_app_config.dart --server-url https://meeting.example.com
      - name: Analyze Dart code
        run: dart analyze --fatal-infos
      - name: Run Flutter tests including config and keystore initialization
        run: flutter test --no-pub
      - name: Compile Android native dependencies without production keys
        run: flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define=APP_ENV=dev --dart-define=OPENMEETING_SERVER_URL=https://meeting.example.com

  images:
    name: Production images and deployment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENMEETING_TEST_STORAGE: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps --only-shell chromium
      - name: Run isolated production-image deployment E2E
        run: node tests/e2e/open-source-readiness.mjs
      - name: Build and load the default CPU inference dependencies
        run: |
          docker build -f server/stt_ms/Dockerfile --build-arg STT_EXTRA=stt-cpu -t openmeeting-ci-cpu:test server
          docker run --rm --network none -i --entrypoint python openmeeting-ci-cpu:test - < scripts/ci/check-stt-runtime.py
      - name: Upload sanitized deployment evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-smoke
          path: .artifacts/open-source-readiness/report.json
          retention-days: 7
          if-no-files-found: warn

  quality-gate:
    # Keep this name stable: configure it as the required GitHub status check.
    name: Quality Gate
    if: ${{ always() }}
    needs: [configuration, desktop, native-desktop, windows-scripts, admin, backend, mobile, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.CHECK_RESULTS);
          const entries = Object.entries(results);
          const failed = entries.filter(([, job]) => job.result !== 'success');
          const table = ['| Check | Result |', '|---|---|',
            ...entries.map(([name, job]) => `| ${name} | ${job.result} |`)];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, table.join('\n') + '\n');
          if (!entries.length || failed.length) {
            console.error('Quality Gate failed:', failed.map(([name, job]) => `${name}: ${job.result}`).join(', '));
            process.exit(1);
          }
          JS
