name: app_installer
description: "Installs a downloaded APK (Android FileProvider + package installer) for in-app updates."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cn.deeprespond.app_installer
        pluginClass: AppInstallerPlugin
