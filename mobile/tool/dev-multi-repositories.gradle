// Used only by dev-multi's private GRADLE_USER_HOME, including Flutter's included build.
beforeSettings { settings ->
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/google' }
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/public' }
}
settingsEvaluated { settings ->
    settings.pluginManagement.repositories.clear()
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/google' }
    settings.pluginManagement.repositories.maven { url 'https://maven.aliyun.com/repository/public' }
    settings.pluginManagement.repositories.gradlePluginPortal()
    settings.pluginManagement.repositories.google()
    settings.pluginManagement.repositories.mavenCentral()
    settings.dependencyResolutionManagement.repositories.clear()
    settings.dependencyResolutionManagement.repositories.maven { url 'https://maven.aliyun.com/repository/google' }
    settings.dependencyResolutionManagement.repositories.maven { url 'https://maven.aliyun.com/repository/public' }
    settings.dependencyResolutionManagement.repositories.google()
    settings.dependencyResolutionManagement.repositories.mavenCentral()
}
allprojects {
    buildscript.repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    // Flutter's included build forbids project repositories; use its settings above.
    if (rootProject.name != 'gradle') {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
    }
}
