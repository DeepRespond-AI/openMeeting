[project]
name = "openmeeting-server"
version = "2.0.0"
description = "OpenMeeting server (microservices): gateway_ms + user_ms + meeting_ms + stt_ms"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Development, CI and production images share uv.lock. CPU/CUDA engines are opt-in.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "h11>=0.16",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "psutil>=5.9",
    "pyjwt>=2.8",
    "cryptography>=42",
    "oss2>=2.19.1",
    "minio>=7.2.18,<8",
    "deeprespond-im-server-sdk>=1.0.0a0",
]

[project.optional-dependencies]
stt-cloud = ["dashscope==2.0.3"]
stt-cpu = [
    "torch==2.11.0", "torchaudio==2.11.0",
    "faster-whisper==1.2.1", "funasr==1.4.21", "modelscope==1.40.2",
    "dashscope==2.0.3", "silero-vad==6.2.3",
]
stt-cuda = [
    "torch==2.6.0", "torchaudio==2.6.0",
    "faster-whisper==1.2.1", "funasr==1.4.21", "modelscope==1.40.2",
    "dashscope==2.0.3", "silero-vad==6.2.3", "nvidia-ml-py>=12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "respx>=0.21",
]

[tool.uv]
package = false
conflicts = [[{ extra = "stt-cpu" }, { extra = "stt-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "stt-cpu" },
    { index = "pytorch-cu124", extra = "stt-cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "stt-cpu" },
    { index = "pytorch-cu124", extra = "stt-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["user_ms/tests", "meeting_ms/tests", "stt_ms/tests", "gateway_ms/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends()/File() defaults are idiomatic
